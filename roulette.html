<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賞品抽選</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #F5C842;
    --deep: #0A0A1A;
    --card: #1C1C3A;
    --text: #F0EEF8;
    --muted: #8884AA;
    --accent: #7B5FFF;
    --accent2: #FF5F9E;
  }

  body { font-family: 'Noto Sans JP', sans-serif; background: var(--deep); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .screen.active { display: flex; }

  #setup { background: radial-gradient(ellipse at 50% 0%, #1a1a40 0%, var(--deep) 70%); }

  .setup-header { text-align: center; margin-bottom: 28px; }
  .setup-header h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(36px, 6vw, 64px); letter-spacing: 4px; color: var(--gold); text-shadow: 0 0 40px rgba(245,200,66,0.4); }

  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 860px; }

  .panel { background: var(--card); border: 1px solid rgba(123,95,255,0.2); border-radius: 16px; padding: 20px; }
  .panel h2 { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 16px; }

  .prize-input { display: flex; gap: 8px; margin-bottom: 8px; }
  .prize-input input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s; }
  .prize-input input:focus { border-color: var(--accent); }

  #prize-display { font-size: 32px; font-weight: 900; color: var(--gold); text-align: center; padding: 16px 12px; background: rgba(245,200,66,0.08); border-radius: 10px; border: 1px solid rgba(245,200,66,0.25); margin-bottom: 8px; min-height: 70px; display: flex; align-items: center; justify-content: center; line-height: 1.3; text-shadow: 0 0 20px rgba(245,200,66,0.4); letter-spacing: 1px; }

  .participant-row { display: grid; gap: 8px; align-items: center; }
  .participant-row input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .participant-row input:focus { border-color: var(--accent); }
  .prob-input { text-align: center; }
  .del-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,95,158,0.3); background: rgba(255,95,158,0.08); color: var(--accent2); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .del-btn:hover { background: rgba(255,95,158,0.2); }

  .add-btn { background: rgba(123,95,255,0.12); border: 1px dashed rgba(123,95,255,0.4); border-radius: 8px; padding: 8px; color: var(--accent); cursor: pointer; font-size: 13px; font-family: inherit; transition: all 0.2s; margin-top: 4px; width: 100%; }
  .add-btn:hover { background: rgba(123,95,255,0.25); }

  .prob-total { font-size: 12px; text-align: right; color: var(--muted); margin-top: 4px; }
  .prob-total.warn { color: #FF7A7A; }

  .start-section { width: 100%; max-width: 860px; margin-top: 20px; }
  .start-btn { width: 100%; padding: 18px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--accent) 0%, #B44DFF 100%); color: #fff; font-family: 'Bebas Neue', cursive; font-size: 26px; letter-spacing: 4px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 4px 30px rgba(123,95,255,0.5); }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(123,95,255,0.7); }
  .start-btn:active { transform: translateY(0); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .toggle-btn { border-radius: 20px; padding: 4px 12px; font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }

  #roulette { background: radial-gradient(ellipse at 50% 40%, #1a0a35 0%, var(--deep) 70%); gap: 24px; }

  .roulette-header { text-align: center; }
  .roulette-header .prize-label { font-size: 13px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .roulette-header .prize-name { font-family: 'Bebas Neue', cursive; font-size: clamp(32px, 6vw, 62px); color: var(--gold); letter-spacing: 3px; text-shadow: 0 0 30px rgba(245,200,66,0.5); line-height: 1.1; }

  .wheel-wrap { position: relative; width: min(400px, 80vw); height: min(400px, 80vw); }
  .wheel-pointer { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 10; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--gold); filter: drop-shadow(0 0 10px rgba(245,200,66,0.8)); }
  canvas#wheel { border-radius: 50%; box-shadow: 0 0 60px rgba(123,95,255,0.4); }

  .spin-btn { padding: 16px 60px; border: none; border-radius: 50px; background: linear-gradient(135deg, var(--gold) 0%, #FF9A1F 100%); color: #0A0A1A; font-family: 'Bebas Neue', cursive; font-size: 28px; letter-spacing: 4px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 4px 30px rgba(245,200,66,0.5); }
  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(245,200,66,0.7); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .back-btn { position: absolute; top: 16px; left: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 16px; color: var(--muted); font-family: inherit; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .back-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  #winner { background: radial-gradient(ellipse at 50% 30%, #2a1040 0%, var(--deep) 70%); text-align: center; }
  .fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .winner-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .winner-label { font-size: 14px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
  .winner-crown { font-size: 72px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .winner-name { font-family: 'Bebas Neue', cursive; font-size: clamp(52px, 12vw, 100px); color: var(--gold); letter-spacing: 6px; text-shadow: 0 0 60px rgba(245,200,66,0.6), 0 0 120px rgba(245,200,66,0.3); animation: pulse-glow 2s ease-in-out infinite; }
  @keyframes pulse-glow { 0%,100% { text-shadow: 0 0 60px rgba(245,200,66,0.6), 0 0 120px rgba(245,200,66,0.3); } 50% { text-shadow: 0 0 80px rgba(245,200,66,0.9), 0 0 160px rgba(245,200,66,0.5); } }
  .winner-prize { font-size: 20px; color: var(--text); opacity: 0.8; }
  .winner-prize span { color: var(--gold); font-weight: 700; }
  .winner-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .action-btn { padding: 12px 28px; border-radius: 10px; font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .btn-again { background: linear-gradient(135deg, var(--accent), #B44DFF); border: none; color: #fff; font-weight: 700; box-shadow: 0 4px 20px rgba(123,95,255,0.4); }
  .btn-again:hover { transform: translateY(-2px); }
  .btn-setup { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--muted); }
  .btn-setup:hover { border-color: var(--text); color: var(--text); }

  .overlay { position: fixed; inset: 0; background: var(--deep); z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
  .overlay.fade-in { opacity: 1; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .participants-scroll { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- ══════════ SETUP SCREEN ══════════ -->
<div class="screen active" id="setup">
  <div class="setup-header">
    <h1>🎰 賞品抽選</h1>
  </div>

  <div class="setup-grid">
    <!-- 左：賞品 -->
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h2 style="margin-bottom:0;">🎁 今週の賞品</h2>
        <button id="toggle-prize-btn" class="toggle-btn" onclick="togglePrize()" style="background:rgba(245,200,66,0.15);border:1px solid rgba(245,200,66,0.4);color:var(--gold);">入力欄を非表示</button>
      </div>
      <div id="prize-input-wrap">
        <div class="prize-input">
          <input type="text" id="prize-input" placeholder="例：Amazonギフト券 5,000円" />
        </div>
      </div>
      <div id="prize-display">—</div>
    </div>

    <!-- 右：参加者 -->
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h2 style="margin-bottom:0;">👥 参加者</h2>
        <button id="toggle-prob-btn" class="toggle-btn" onclick="toggleProb()" style="background:rgba(123,95,255,0.15);border:1px solid rgba(123,95,255,0.4);color:var(--accent);">確率を非表示</button>
      </div>
      <div id="prob-header" style="display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--muted);padding-left:4px;">名前</span>
        <span style="font-size:11px;color:var(--muted);text-align:center;">確率 (%)</span>
        <span></span>
      </div>
      <div class="participants-scroll" id="participants-list"></div>
      <button class="add-btn" onclick="addParticipant()">＋ 参加者を追加</button>
      <div class="prob-total" id="prob-total">合計: 0%</div>
    </div>
  </div>

  <div class="start-section">
    <button class="start-btn" id="go-btn" onclick="goToRoulette()" disabled>▶ ルーレットを開始</button>
    <div style="margin-top:12px;display:flex;justify-content:flex-end;">
      <button id="toggle-share-btn" onclick="toggleShare()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 14px;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;transition:all 0.2s;">🔗 共有URLを表示</button>
    </div>
    <div id="share-section" style="display:none;margin-top:8px;">
      <div style="display:flex;gap:10px;">
        <button onclick="generateShareURL()" style="flex:1;padding:12px;border:1px solid rgba(245,200,66,0.4);border-radius:10px;background:rgba(245,200,66,0.1);color:var(--gold);font-family:inherit;font-size:14px;cursor:pointer;">🔗 共有URLを生成</button>
        <button onclick="copyShareURL()" id="copy-btn" style="flex:1;padding:12px;border:1px solid rgba(123,95,255,0.4);border-radius:10px;background:rgba(123,95,255,0.1);color:var(--accent);font-family:inherit;font-size:14px;cursor:pointer;display:none;">📋 URLをコピー</button>
      </div>
      <div id="share-url-box" style="display:none;margin-top:8px;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:12px;color:var(--muted);word-break:break-all;line-height:1.6;"></div>
    </div>
  </div>
</div>

<!-- ══════════ ROULETTE SCREEN ══════════ -->
<div class="screen" id="roulette">
  <button class="back-btn" onclick="goBack()">← 設定に戻る</button>
  <div class="roulette-header">
    <div class="prize-label">🎁 今週の賞品</div>
    <div class="prize-name" id="roulette-prize">—</div>
  </div>
  <div class="wheel-wrap">
    <div class="wheel-pointer"></div>
    <canvas id="wheel" width="400" height="400"></canvas>
  </div>
  <button class="spin-btn" id="spin-btn" onclick="startSpin()">START</button>
</div>

<!-- ══════════ WINNER SCREEN ══════════ -->
<div class="screen" id="winner">
  <canvas class="fireworks" id="fireworks"></canvas>
  <div class="winner-content">
    <div class="winner-label">🎉 当選者はこちら！</div>
    <div class="winner-crown">👑</div>
    <div class="winner-name" id="winner-name">—</div>
    <div class="winner-prize">商品：<span id="winner-prize">—</span></div>
    <div class="winner-actions">
      <button class="action-btn btn-again" onclick="goBack()">もう一度抽選する</button>
      <button class="action-btn btn-setup" onclick="goToSetup()">設定を変更する</button>
    </div>
  </div>
</div>

<script>
// ══ STATE ══
let participants = [];
let currentPrize = '';
let spinning = false;
let currentAngle = 0;
let animFrame;
let fireworksCtx;
let fireworksParticles = [];
let probVisible = true;
let prizeInputVisible = true;
let shareVisible = false;
let generatedURL = '';

const COLORS = ['#7B5FFF','#FF5F9E','#F5C842','#00D4AA','#FF7A1F','#5FC8FF','#B44DFF','#FF4D6A','#1FD870','#FFB347'];

// ══ トグル ══
function togglePrize() {
  prizeInputVisible = !prizeInputVisible;
  const btn = document.getElementById('toggle-prize-btn');
  document.getElementById('prize-input-wrap').style.display = prizeInputVisible ? '' : 'none';
  btn.textContent = prizeInputVisible ? '入力欄を非表示' : '入力欄を表示';
  btn.style.background = prizeInputVisible ? 'rgba(245,200,66,0.15)' : 'rgba(255,255,255,0.06)';
  btn.style.color = prizeInputVisible ? 'var(--gold)' : 'var(--muted)';
  btn.style.borderColor = prizeInputVisible ? 'rgba(245,200,66,0.4)' : 'rgba(255,255,255,0.15)';
}

function toggleProb() {
  probVisible = !probVisible;
  const btn = document.getElementById('toggle-prob-btn');
  const header = document.getElementById('prob-header');
  btn.textContent = probVisible ? '確率を非表示' : '確率を表示';
  btn.style.background = probVisible ? 'rgba(123,95,255,0.15)' : 'rgba(255,255,255,0.06)';
  btn.style.color = probVisible ? 'var(--accent)' : 'var(--muted)';
  btn.style.borderColor = probVisible ? 'rgba(123,95,255,0.4)' : 'rgba(255,255,255,0.15)';
  header.style.gridTemplateColumns = probVisible ? '1fr 90px 36px' : '1fr 36px';
  header.children[1].style.display = probVisible ? '' : 'none';
  renderParticipants();
}

function toggleShare() {
  shareVisible = !shareVisible;
  const btn = document.getElementById('toggle-share-btn');
  document.getElementById('share-section').style.display = shareVisible ? 'block' : 'none';
  btn.textContent = shareVisible ? '🔗 共有URLを非表示' : '🔗 共有URLを表示';
  btn.style.color = shareVisible ? 'var(--gold)' : 'var(--muted)';
  btn.style.borderColor = shareVisible ? 'rgba(245,200,66,0.4)' : 'rgba(255,255,255,0.15)';
  btn.style.background = shareVisible ? 'rgba(245,200,66,0.1)' : 'rgba(255,255,255,0.06)';
  if (!shareVisible) {
    document.getElementById('share-url-box').style.display = 'none';
    document.getElementById('copy-btn').style.display = 'none';
  }
}

// ══ 参加者 ══
document.getElementById('prize-input').addEventListener('input', e => {
  currentPrize = e.target.value.trim();
  document.getElementById('prize-display').textContent = currentPrize || '—';
  validateForm();
  saveData();
});

function addParticipant(name = '', prob = '') {
  const id = Date.now() + Math.random();
  participants.push({ id, name, prob });
  renderParticipants();
  saveData();
}

function removeParticipant(id) {
  participants = participants.filter(p => p.id !== id);
  renderParticipants();
  saveData();
}

function renderParticipants() {
  const list = document.getElementById('participants-list');
  list.innerHTML = participants.map(p => `
    <div class="participant-row" style="grid-template-columns:${probVisible ? '1fr 90px 36px' : '1fr 36px'}">
      <input type="text" placeholder="名前" value="${p.name}" data-id="${p.id}" data-field="name" oninput="updateParticipant(this)" />
      ${probVisible ? `<input type="number" class="prob-input" placeholder="%" value="${p.prob}" min="0" max="100" step="0.1" data-id="${p.id}" data-field="prob" oninput="updateParticipant(this)" />` : ''}
      <button class="del-btn" onclick="removeParticipant(${p.id})">×</button>
    </div>
  `).join('');
  updateProbTotal();
  validateForm();
}

function updateParticipant(el) {
  const id = parseFloat(el.dataset.id);
  const p = participants.find(p => p.id === id);
  if (p) {
    p[el.dataset.field] = el.value;
    if (el.dataset.field === 'prob') updateProbTotal();
    validateForm();
    saveData();
  }
}

function updateProbTotal() {
  const total = participants.reduce((s, p) => s + (parseFloat(p.prob) || 0), 0);
  const el = document.getElementById('prob-total');
  if (probVisible) {
    el.style.display = '';
    el.textContent = `合計: ${Math.round(total * 10) / 10}%`;
    el.className = 'prob-total' + (Math.abs(total - 100) > 0.5 ? ' warn' : '');
  } else {
    el.style.display = 'none';
  }
}

function validateForm() {
  const total = participants.reduce((s, p) => s + (parseFloat(p.prob) || 0), 0);
  const totalOk = !probVisible || Math.abs(total - 100) <= 0.5;
  const valid = currentPrize.length > 0
    && participants.length >= 2
    && participants.every(p => p.name.trim().length > 0 && parseFloat(p.prob) > 0)
    && totalOk;
  document.getElementById('go-btn').disabled = !valid;
}

// ══ 保存・読込 ══
function saveData() {
  try {
    localStorage.setItem('roulette_data', JSON.stringify({ prize: currentPrize, participants }));
  } catch(e) {}
}

function applyData(data) {
  currentPrize = data.prize || '';
  document.getElementById('prize-input').value = currentPrize;
  document.getElementById('prize-display').textContent = currentPrize || '—';
  participants = (data.participants || []).map(p => ({ ...p, id: Date.now() + Math.random() }));
  renderParticipants();
  validateForm();
}

function loadData() {
  try {
    // URLパラメータ優先
    const urlData = new URLSearchParams(window.location.search).get('data');
    if (urlData) {
      const data = JSON.parse(decodeURIComponent(urlData));
      applyData(data);
      saveData();
      return;
    }
    // localStorage
    const saved = localStorage.getItem('roulette_data');
    if (saved) {
      applyData(JSON.parse(saved));
      return;
    }
  } catch(e) {}
  // 初回サンプル
  addParticipant('田中 一郎', '40');
  addParticipant('鈴木 花子', '35');
  addParticipant('佐藤 次郎', '25');
  document.getElementById('prize-input').value = 'Amazonギフト券 5,000円';
  currentPrize = 'Amazonギフト券 5,000円';
  document.getElementById('prize-display').textContent = currentPrize;
  validateForm();
}

// ══ 共有URL ══
function generateShareURL() {
  const data = JSON.stringify({ prize: currentPrize, participants });
  const encoded = encodeURIComponent(data);
  const base = location.href.split('?')[0];
  generatedURL = base + '?data=' + encoded;
  document.getElementById('share-url-box').style.display = 'block';
  document.getElementById('share-url-box').textContent = generatedURL;
  document.getElementById('copy-btn').style.display = 'block';
}

function copyShareURL() {
  if (!generatedURL) return;
  navigator.clipboard.writeText(generatedURL).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ コピーしました！';
    btn.style.color = '#00D4AA';
    setTimeout(() => { btn.textContent = '📋 URLをコピー'; btn.style.color = 'var(--accent)'; }, 2500);
  });
}

loadData();

// ══ 画面遷移 ══
function setScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function fadeTransition(cb) {
  const ov = document.getElementById('overlay');
  ov.classList.add('fade-in');
  setTimeout(() => { cb(); ov.classList.remove('fade-in'); }, 400);
}

function goToRoulette() {
  document.getElementById('roulette-prize').textContent = currentPrize;
  document.getElementById('spin-btn').disabled = false;
  document.getElementById('spin-btn').textContent = 'START';
  spinning = false;
  currentAngle = 0;
  fadeTransition(() => { setScreen('roulette'); drawWheel(0); });
}

function goBack() {
  cancelAnimationFrame(animFrame);
  spinning = false;
  currentAngle = 0;
  fadeTransition(() => setScreen('roulette'));
  document.getElementById('spin-btn').disabled = false;
  document.getElementById('spin-btn').textContent = 'START';
  drawWheel(0);
}

function goToSetup() {
  cancelAnimationFrame(animFrame);
  spinning = false;
  fadeTransition(() => setScreen('setup'));
}

// ══ ルーレット描画 ══
function getValidParticipants() {
  return participants.map(p => ({ name: p.name.trim(), prob: parseFloat(p.prob) || 0 })).filter(p => p.prob > 0);
}

function drawWheel(angle) {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width / 2, cy = canvas.height / 2, r = canvas.width / 2 - 4;
  const parts = getValidParticipants();
  const total = parts.reduce((s, p) => s + p.prob, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let start = angle - Math.PI / 2;
  parts.forEach((p, i) => {
    const sweep = (p.prob / total) * Math.PI * 2;
    const mid = start + sweep / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + sweep);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx + Math.cos(mid) * r * 0.62, cy + Math.sin(mid) * r * 0.62);
    ctx.rotate(mid + Math.PI / 2);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(16, 200 / parts.length + 4)}px 'Noto Sans JP', sans-serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    const label = p.name.length > 8 ? p.name.slice(0, 8) + '…' : p.name;
    ctx.fillText(label, 0, 5);
    ctx.restore();

    if (p.prob >= 10) {
      ctx.save();
      ctx.translate(cx + Math.cos(mid) * r * 0.3, cy + Math.sin(mid) * r * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = `10px 'Noto Sans JP', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`${p.prob}%`, 0, 4);
      ctx.restore();
    }
    start += sweep;
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#0A0A1A';
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,200,66,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#F5C842';
  ctx.font = `bold 14px 'Noto Sans JP', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('GO', cx, cy);
}

// ══ 抽選ロジック ══
function pickWinner() {
  const parts = getValidParticipants();
  const total = parts.reduce((s, p) => s + p.prob, 0);
  let r = Math.random() * total;
  for (const p of parts) { r -= p.prob; if (r <= 0) return p; }
  return parts[parts.length - 1];
}

function startSpin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('spin-btn').textContent = '…';

  const winner = pickWinner();
  const parts = getValidParticipants();
  const total = parts.reduce((s, p) => s + p.prob, 0);
  let angleSum = 0;
  for (const p of parts) {
    const sweep = (p.prob / total) * Math.PI * 2;
    if (p.name === winner.name) {
      const sliceCenter = angleSum + sweep / 2;
      const extraSpins = Math.PI * 2 * (8 + Math.random() * 4);
      animateSpin(currentAngle, -sliceCenter + extraSpins, 10000, winner);
      break;
    }
    angleSum += sweep;
  }
}

function animateSpin(startAngle, targetAngle, duration, winner) {
  const startTime = performance.now();
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) { animFrame = requestAnimationFrame(frame); }
    else { currentAngle = targetAngle; spinning = false; setTimeout(() => showWinner(winner), 400); }
  }
  animFrame = requestAnimationFrame(frame);
}

// ══ 当選画面 ══
function showWinner(winner) {
  document.getElementById('winner-name').textContent = winner.name;
  document.getElementById('winner-prize').textContent = currentPrize;
  fadeTransition(() => { setScreen('winner'); startFireworks(); });
}

// ══ 花火 ══
function startFireworks() {
  const canvas = document.getElementById('fireworks');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  fireworksCtx = canvas.getContext('2d');
  fireworksParticles = [];
  launchFirework(); launchFirework();
  requestAnimationFrame(animFireworks);
}

function launchFirework() {
  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight * 0.6;
  const colors = ['#F5C842','#7B5FFF','#FF5F9E','#00D4AA','#FF7A1F','#fff'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  for (let i = 0; i < 60; i++) {
    const angle = Math.PI * 2 * i / 60;
    const speed = 2 + Math.random() * 5;
    fireworksParticles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alpha: 1, color, size: 2 + Math.random() * 3, life: 80 + Math.random() * 60 });
  }
}

function animFireworks() {
  if (!document.getElementById('winner').classList.contains('active')) return;
  fireworksCtx.clearRect(0, 0, fireworksCtx.canvas.width, fireworksCtx.canvas.height);
  fireworksParticles = fireworksParticles.filter(p => p.alpha > 0.01);
  fireworksParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.98; p.alpha -= 1 / p.life;
    fireworksCtx.beginPath();
    fireworksCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    fireworksCtx.fillStyle = p.color;
    fireworksCtx.globalAlpha = p.alpha;
    fireworksCtx.fill();
    fireworksCtx.globalAlpha = 1;
  });
  if (Math.random() < 0.04) launchFirework();
  requestAnimationFrame(animFireworks);
}
</script>
